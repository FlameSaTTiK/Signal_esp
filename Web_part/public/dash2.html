<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Device Tracking Dashboard</title>
    <link rel="stylesheet" href="styles/dash2.css">
    <script src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY&callback=initMap" async defer></script>
</head>
<body>
    <div class="dashboard-container">
        <h1>Device Tracking Dashboard</h1>

        <!-- Dropdown to select device -->
        <div class="dropdown">
            <label for="deviceSelect">Select Device:</label>
            <select id="deviceSelect">
                <option value="device1">Device 1</option>
                <option value="device2">Device 2</option>
                <option value="device3">Device 3</option>
            </select>
        </div>

        <!-- Real-Time Location Tracking Section -->
        <div class="tracking-section">
            <button id="trackButton">Start Tracking</button>
            <div id="deviceStatus">Device Status: Disconnected</div>
        </div>

        <!-- Map Section -->
        <div id="map"></div>

        <!-- Live Location Button -->
        <div class="live-location">
            <button id="liveLocationButton">Get Live Location</button>
        </div>

        <!-- Data Retrieval and Deletion -->
        <div class="data-actions">
            <button id="retrieveDataButton">Retrieve 30 Days Data</button>
            <button id="deleteDataButton">Delete Data</button>
        </div>

        <!-- Download Data Button -->
        <div class="download-section">
            <button id="downloadButton">Download Data</button>
        </div>

        <!-- Advertisement Section -->
        <div class="advertisement">
            <p>Advertisement: Promote your project here!</p>
        </div>

        <!-- Subscription Button -->
        <div class="subscription">
            <button id="subscribeButton">Subscribe Now</button>
        </div>
    </div>

    <script src="dash2.js"></script>
</body>
</html>
